---
# Project: https://github.com/abbra/kurbu5-pkinit
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # System packages required to compile kurbu5-pkinit and to run JavaScript-based
  # GitHub Actions (actions/checkout, actions/cache) inside the container.
  #   tar, gzip               — archive tools needed by actions/checkout and actions/cache
  #   gcc, gcc-c++, make      — C/C++ toolchain for the kurbu5-sys / native-ossl-sys FFI crates
  #   krb5-devel              — libkrb5 headers for the kurbu5-sys FFI bindings
  #   openssl-devel           — libssl/libcrypto headers + .pc file for openssl-sys and native-ossl-sys
  #   clang-libs, clang-devel — libclang.so + built-in headers (stdarg.h etc.) for bindgen
  #   pkgconf-pkg-config      — pkg-config used by the *-sys build scripts
  #   nodejs, npm, node       — required by actions/checkout and actions/cache
  #   cargo, rust, rustfmt, cargo-clippy — Rust toolchain (not bundled in the base image)
  # (update key suffix when changing packages)
  DNF_PACKAGES: >-
    tar gzip gcc gcc-c++ make krb5-devel openssl-devel clang-libs clang-devel
    pkgconf-pkg-config nodejs /usr/bin/npm /usr/bin/node
    cargo rust rustfmt cargo-clippy
  # Additional packages needed only by the system-test job: a real KDC and
  # kinit (krb5-server, krb5-workstation), MIT's own pkinit.so for
  # cross-plugin interop testing (krb5-pkinit), openssl for PKI generation,
  # and python3 to drive tests/system/pkinit/setup.py.
  SYSTEM_TEST_PACKAGES: >-
    krb5-server krb5-workstation krb5-pkinit openssl python3

jobs:
  # ── Build ──────────────────────────────────────────────────────────────────
  # Compiles the full workspace (debug) once on stable and saves the resulting
  # artifacts to cache. All downstream jobs restore from this cache instead of
  # recompiling from scratch.
  build:
    name: Build
    runs-on: ubuntu-latest
    container: quay.io/fedora/fedora:latest
    steps:
      - name: Install native dependencies
        run: dnf install -y $DNF_PACKAGES
      - uses: actions/checkout@v4
      - name: Restore cargo registry cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-v1-
      - name: Restore cargo git cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: cargo-git-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-git-v1-
      - name: Restore debug build artifacts
        uses: actions/cache@v5
        with:
          path: |
            target/debug/.fingerprint
            target/debug/deps
            target/debug/build
            target/debug/examples
          key: cargo-target-debug-stable-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-debug-stable-v1-
      - name: Build workspace
        run: ./contrib/ci/local-ci.sh --no-deps build
      - name: Prune incremental artifacts before caching
        run: rm -rf target/debug/incremental

  # ── Format ─────────────────────────────────────────────────────────────────
  # Runs in parallel with build — rustfmt needs no compiled artifacts.
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    container: quay.io/fedora/fedora:latest
    steps:
      - name: Install native dependencies
        run: dnf install -y $DNF_PACKAGES
      - uses: actions/checkout@v4
      - name: Check formatting
        run: ./contrib/ci/local-ci.sh --no-deps fmt

  # ── Workflow linting ────────────────────────────────────────────────────────
  # Validates GitHub Actions workflow YAML; runs in parallel with build.
  # Uses actionlint when available, falls back to yamllint, skips gracefully
  # if neither is present.
  lint-workflows:
    name: Workflow Lint
    runs-on: ubuntu-latest
    container: quay.io/fedora/fedora:latest
    steps:
      - name: Install native dependencies
        run: dnf install -y $DNF_PACKAGES yamllint
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions workflow files
        run: ./contrib/ci/local-ci.sh --no-deps lint-workflows

  # ── Clippy ─────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    needs: [build]
    runs-on: ubuntu-latest
    container: quay.io/fedora/fedora:latest
    steps:
      - name: Install native dependencies
        run: dnf install -y $DNF_PACKAGES
      - uses: actions/checkout@v4
      - name: Restore cargo registry cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-v1-
      - name: Restore debug build artifacts
        uses: actions/cache@v5
        with:
          path: |
            target/debug/.fingerprint
            target/debug/deps
            target/debug/build
            target/debug/examples
          key: cargo-target-debug-stable-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-debug-stable-v1-
      - name: Run clippy
        run: ./contrib/ci/local-ci.sh --no-deps clippy

  # ── Documentation ──────────────────────────────────────────────────────────
  doc:
    name: Documentation
    needs: [build]
    runs-on: ubuntu-latest
    container: quay.io/fedora/fedora:latest
    steps:
      - name: Install native dependencies
        run: dnf install -y $DNF_PACKAGES
      - uses: actions/checkout@v4
      - name: Restore cargo registry cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-v1-
      - name: Restore debug build artifacts
        uses: actions/cache@v5
        with:
          path: |
            target/debug/.fingerprint
            target/debug/deps
            target/debug/build
            target/debug/examples
          key: cargo-target-debug-stable-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-debug-stable-v1-
      - name: Build documentation
        run: ./contrib/ci/local-ci.sh --no-deps doc

  # ── Test suite ─────────────────────────────────────────────────────────────
  test:
    name: Test Suite
    needs: [build]
    runs-on: ubuntu-latest
    container: quay.io/fedora/fedora:latest
    steps:
      - name: Install native dependencies
        run: dnf install -y $DNF_PACKAGES
      - uses: actions/checkout@v4
      - name: Restore cargo registry cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-v1-
      - name: Restore build artifacts
        uses: actions/cache@v5
        with:
          path: |
            target/debug/.fingerprint
            target/debug/deps
            target/debug/build
            target/debug/examples
          key: cargo-target-debug-stable-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-debug-stable-v1-
      - name: Run tests
        run: ./contrib/ci/local-ci.sh --no-deps test

  # ── System test ────────────────────────────────────────────────────────────
  # Builds the plugin in release mode, spins up an ephemeral KDC, and runs
  # kinit against it — including cross-plugin combos with MIT's own pkinit.so.
  system-test:
    name: System Test
    needs: [build]
    runs-on: ubuntu-latest
    container: quay.io/fedora/fedora:latest
    steps:
      - name: Install native dependencies
        run: dnf install -y $DNF_PACKAGES $SYSTEM_TEST_PACKAGES
      - uses: actions/checkout@v4
      - name: Restore cargo registry cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-v1-
      - name: Run PKINIT system integration tests
        run: ./contrib/ci/local-ci.sh --no-deps system-test
