[package]
name = "kurbu5-pkinit"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "PKINIT pre-authentication plugin for MIT Kerberos"

[lib]
crate-type = ["cdylib"]

[dependencies]
kurbu5-rs = { version = "0.1", features = ["kdcpreauth", "clpreauth", "certauth"] }
pkinit-core = { path = "../pkinit-core" }
libc = "0.2"
